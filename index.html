<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>大巴扎生涯个人爱好表</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#e8e4dc;color:#15110c;
    font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden}
  header{max-width:1240px;margin:0 auto;padding:26px 20px 6px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header .hint{color:#7d7466;font-size:12px}
  main{max-width:1240px;margin:0 auto;padding:14px 20px 60px;display:flex;gap:20px;align-items:flex-start}
  .stage{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;gap:14px}
  .canvas-wrap{position:relative;line-height:0;max-width:100%}
  canvas#grid{
    display:block;max-width:100%;height:auto;background:#fff;cursor:pointer;
    border-radius:4px;box-shadow:0 6px 22px rgba(0,0,0,.12);
  }
  .tip{color:#8b8273;font-size:12px;text-align:center}

  aside.panel{flex:0 0 320px;width:320px;display:flex;flex-direction:column;gap:12px}
  .card{background:#fff;border-radius:8px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
  .card h3{margin:0 0 10px;font-size:13px;font-weight:700;letter-spacing:.5px;color:#3a342b}
  .card h3 small{font-weight:400;color:#a49a8b}
  input[type=text],input[type=number],textarea,select{
    width:100%;font:inherit;padding:8px 10px;border:1.5px solid #d3cbbd;border-radius:5px;background:#fff;outline:none;color:#15110c;
  }
  input:focus,textarea:focus,select:focus{border-color:#15110c}
  textarea{resize:vertical;line-height:1.6;font-size:13px}
  .row2{display:flex;gap:8px}
  .row2>*{flex:1;min-width:0}
  label.f{display:block;font-size:12px;color:#7d7466;margin-bottom:4px}
  .chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#4a4438;margin-top:8px}
  .chk input{width:auto}
  button{
    font:inherit;cursor:pointer;border:1.5px solid #15110c;background:#fff;color:#15110c;
    padding:8px 12px;border-radius:5px;font-weight:600;transition:background .12s,color .12s;
  }
  button:hover{background:#15110c;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:disabled:hover{background:#fff;color:#15110c}
  button.primary{background:#15110c;color:#fff}
  button.primary:hover{background:#3a342b}
  button.big{width:100%;padding:12px;font-size:15px}
  button.danger{border-color:#b8442f;color:#b8442f}
  button.danger:hover{background:#b8442f;color:#fff}
  button.mini{padding:5px 9px;font-size:12px;font-weight:500}

  .modal{position:fixed;inset:0;background:rgba(20,16,10,.66);display:flex;align-items:center;justify-content:center;padding:24px 14px;z-index:50}
  .modal[hidden]{display:none}
  .sheet{
    background:#fff;border-radius:10px;width:min(1040px,100%);max-height:100%;
    display:flex;flex-direction:column;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.4)
  }
  .sheet-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #efeae1}
  .sheet-head h2{margin:0;font-size:15px;font-weight:700}
  .sheet-head .celltag{font-size:12px;color:#a49a8b}
  .sheet-head .x{margin-left:auto;border:none;background:none;font-size:18px;line-height:1;padding:6px 8px;color:#7d7466;font-weight:400}
  .sheet-head .x:hover{background:#f4f0e9;color:#15110c}
  .sheet-body{display:flex;flex-direction:column;min-height:0;flex:1 1 auto;overflow:hidden;padding:14px 16px;gap:10px}
  form.searchbar{display:flex;gap:8px;margin:0}
  form.searchbar input{flex:1}
  .quickrow{display:flex;gap:6px;flex-wrap:wrap}
  .quickrow button{padding:4px 9px;font-size:12px;font-weight:500;border-color:#d3cbbd;color:#4a4438}
  .note{font-size:12px;color:#a49a8b}
  .note.err{color:#b8442f}
  .results{
    overflow-y:auto;flex:1 1 auto;display:grid;gap:10px;align-content:start;
    grid-template-columns:repeat(auto-fill,minmax(112px,1fr));padding-right:2px;min-height:140px
  }
  .results.loading{opacity:.45;pointer-events:none;transition:opacity .15s}
  .ritem{cursor:pointer;border-radius:6px;padding:5px;transition:background .12s;border:1.5px solid transparent}
  .ritem:hover{background:#f4f0e9}
  .ritem.on{border-color:#15110c;background:#f4f0e9}
  .ritem .box{width:100%;aspect-ratio:1/1;background:#f6f3ee;border-radius:5px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ritem img{max-width:100%;max-height:100%;display:block}
  .ritem p{margin:5px 0 0;font-size:11.5px;line-height:1.35;color:#3a342b;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .altway{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid #efeae1;padding-top:10px}
  .altway label{font-size:12px;color:#7d7466}
  .altway input[type=text]{flex:1 1 220px;width:auto}
  .sheet-foot{border-top:1px solid #efeae1;padding:12px 16px;display:flex;gap:8px;background:#fff;justify-content:flex-end}
  #previewSheet{width:min(820px,100%)}
  #previewSheet img{max-width:100%;display:block;margin:0 auto;border-radius:6px;background:#fff}
  .preview-body{padding:16px;overflow:auto}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:#15110c;color:#fff;
    padding:9px 16px;border-radius:999px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none
  }
  .toast.on{opacity:1}
  .canvas-tools{display:none}
  .cell-list{display:none}

  @media (max-width:1000px){
    main{flex-direction:column;align-items:stretch}
    aside.panel{width:auto;flex:1 1 auto}
  }
  @media (max-width:760px){
    header{padding:16px 14px 4px;gap:6px}
    header h1{font-size:17px}
    header .hint{font-size:11.5px;line-height:1.5}
    main{padding:10px 14px 44px;gap:14px}
    .stage{gap:10px}
    .tip{font-size:12px}
    .canvas-tools{display:flex;justify-content:center;width:100%}
    .canvas-wrap{width:100%}
    body.canvas-zoom .canvas-wrap{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
    .cell-list{display:flex;flex-direction:column;gap:8px;width:100%}
    .cell-list::before{content:'格子列表 · 直接改格名，或点「选择」放图';font-size:12px;color:#8b8273;padding:2px 2px 0}
    .cell-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 10px;box-shadow:0 1px 6px rgba(0,0,0,.07)}
    .cell-row .idx{flex:0 0 auto;width:18px;text-align:center;color:#c0b7a8;font-size:12px}
    .cell-row .thumb{flex:0 0 auto;width:44px;height:44px;border-radius:6px;background:#f4f0e9;object-fit:contain;display:flex;align-items:center;justify-content:center;color:#c0b7a8;font-size:20px;line-height:1}
    .cell-row .meta{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
    .cell-row .label-input{width:100%;font-size:16px;padding:6px 8px;border:1.5px solid #e2dbcf;border-radius:6px;min-width:0}
    .cell-row .sub{font-size:11px;color:#a49a8b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cell-row .acts{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
    .cell-row .acts button{padding:5px 9px;font-size:12px;font-weight:600}
    aside.panel{width:auto}
    .export-card{order:-1}
    .panel .card{padding:12px}
    input[type=text],input[type=number],textarea,select{font-size:16px}
    .modal{padding:0}
    .sheet{width:100%;height:100%;max-height:100%;border-radius:0}
    .sheet-head{padding:12px 14px}
    .results{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
    form.searchbar input{font-size:16px;padding:10px 12px}
    form.searchbar button{padding:10px 16px}
    .sheet-foot{padding:10px 14px;box-shadow:0 -6px 16px rgba(0,0,0,.07)}
    .sheet-foot button{flex:1 1 auto;padding:10px 12px}
    .altway label{display:none}
    .altway input[type=text]{flex:1 1 100%}
    #previewSheet{width:100%;height:100%}
    #previewSheet .preview-body{flex:1 1 auto;display:flex;align-items:center;justify-content:center;overflow:auto;padding:12px}
    #previewSheet .preview-body img{max-width:100%;max-height:100%;width:auto}
  }
</style>
</head>
<body>

<header>
  <h1>大巴扎生涯个人爱好表</h1>
  <span class="hint">点格子搜图或上传 · 右侧改格名与尺寸 · 生成图片</span>
</header>

<main>
  <section class="stage">
    <div class="canvas-wrap"><canvas id="grid"></canvas></div>
    <div class="canvas-tools"><button class="mini" id="zoomToggle">查看原尺寸</button></div>
    <div class="tip">点击任意格子 → 搜索图片 / 上传 → 生成图片导出</div>
    <section class="cell-list" id="cellList"></section>
  </section>

  <aside class="panel">
    <div class="card">
      <h3>标题</h3>
      <input type="text" id="titleInput" placeholder="表头标题">
    </div>

    <div class="card">
      <h3>网格尺寸</h3>
      <div class="row2">
        <label class="f">列数<input type="number" id="colsInput" min="1" max="8" step="1"></label>
        <label class="f">行数<input type="number" id="rowsInput" min="1" max="8" step="1"></label>
      </div>
    </div>

    <div class="card">
      <h3>格名 <small>每行一个，共 <b id="labelCount">0</b> 个</small></h3>
      <textarea id="labelsInput" rows="9" spellcheck="false"></textarea>
      <div class="row2" style="margin-top:8px">
        <button class="mini" id="defaultLabelsBtn">套用默认格名</button>
        <button class="mini" id="clearLabelsBtn">清空格名</button>
      </div>
    </div>

    <div class="card">
      <h3>显示</h3>
      <div class="row2">
        <label class="f">图片填充
          <select id="fitSel">
            <option value="contain">适应（完整显示）</option>
            <option value="cover">填满（裁切）</option>
          </select>
        </label>
      </div>
    </div>

    <div class="card">
      <h3>页脚</h3>
      <input type="text" id="footerInput">
      <label class="chk"><input type="checkbox" id="footerShow"> 显示页脚</label>
    </div>

    <div class="card export-card">
      <h3>导出</h3>
      <div class="row2" style="margin-bottom:8px">
        <select id="fmtSel">
          <option value="png">PNG（无损）</option>
          <option value="jpeg">JPG（体积小）</option>
        </select>
        <select id="scaleSel">
          <option value="1">1x</option>
          <option value="2" selected>2x</option>
          <option value="3">3x</option>
        </select>
      </div>
      <button class="primary big" id="exportBtn">生成图片</button>
    </div>

    <div class="card">
      <h3>配置</h3>
      <div class="row2" style="margin-bottom:8px">
        <button class="mini" id="saveJsonBtn">导出配置</button>
        <button class="mini" id="loadJsonBtn">导入配置</button>
      </div>
      <button class="danger mini" id="resetBtn" style="width:100%">清空所有格子</button>
      <input type="file" id="fileInput" accept="application/json,.json" hidden>
    </div>
  </aside>
</main>

<!-- 选图弹窗 -->
<div class="modal" id="picker" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <h2>选择图片</h2>
      <span class="celltag" id="cellTag"></span>
      <button class="x" data-close>✕</button>
    </div>

    <div class="sheet-body">
      <form class="searchbar" id="searchForm" autocomplete="off">
        <input type="text" id="q" placeholder="搜物品 / 英雄 / 技能图，如 sword、Vanessa">
        <button type="submit" class="primary" id="searchBtn">搜索</button>
      </form>
      <div class="quickrow" id="quickRow"></div>
      <div class="note" id="searchNote"></div>
      <div class="results" id="results"></div>
      <div class="altway">
        <label>或</label>
        <button class="mini" id="uploadBtn">上传本地图片</button>
        <input type="text" id="urlInput" placeholder="粘贴图片网址（https://…）">
        <button class="mini" id="urlBtn">用这个网址</button>
        <input type="file" id="imgFile" accept="image/*" hidden>
      </div>
    </div>

    <div class="sheet-foot">
      <button class="mini danger" id="clearBtn">清空此格</button>
      <button class="mini" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- 预览弹窗 -->
<div class="modal" id="preview" hidden>
  <div class="sheet" id="previewSheet">
    <div class="sheet-head">
      <h2>生成完成</h2>
      <span class="celltag" id="previewSize"></span>
      <button class="x" data-close>✕</button>
    </div>
    <div class="preview-body"><img id="previewImg" alt="生成的大巴扎生涯个人爱好表"></div>
    <div class="sheet-foot">
      <a id="downloadLink" download><button class="primary">下载图片</button></a>
      <span class="note" style="margin-left:10px">移动端可长按图片保存</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  return IMG_PROXY + encodeURIComponent(bare) + '&w=' + (w || 700) + '&output=png';

const WIKI_BASE = "https://thebazaar.wiki.gg/images/";
const WIKI_ITEMS = (()=>{
  const map = new Map();
  for(const enc of WIKI_FILES){
    const i = enc.indexOf("|");
    const path = i < 0 ? enc : enc.slice(0, i);
    const guess = path.split("/").pop().replace(/\.[a-z0-9]+$/i, "").replace(/_/g, " ");
    const name = i < 0 ? guess : enc.slice(i + 1);
    const key = name.toLowerCase();
    const isPng = /\.png$/i.test(path);
    if(map.has(key) && !isPng) continue;   // 同名优先保留 png
    map.set(key, { path, name, url: WIKI_BASE + path });
  }
  return [...map.values()].sort((a, b)=> a.name.localeCompare(b.name));
})();
const WIKI_BY_LOWER = WIKI_ITEMS.map(it=>it.name.toLowerCase());

/* ============================================================
   素材检索（基于本地索引，无需联网；图片经 wsrv.nl 代理加载）
   ============================================================ */

/* 本地检索：文件名包含全部关键词即命中，按匹配位置/长度排序 */
function searchImages(kw){
  const q = String(kw || '').trim().toLowerCase();
  if(!q){
    return WIKI_ITEMS.slice(0, 48).map(it => ({ name: it.name, url: it.url, thumb: proxied(it.url, 240) }));
  }
  const tokens = q.split(/\s+/).filter(Boolean);
  const out = [];
  for(let i = 0; i < WIKI_ITEMS.length; i++){
    const lower = WIKI_BY_LOWER[i];
    let ok = true;
    for(const t of tokens){ if(!lower.includes(t)){ ok = false; break; } }
    if(!ok) continue;
    let score;
    if(lower === q) score = 6;
    else if(lower.startsWith(q + ' ') || lower.startsWith(q)) score = 5;
    else if((' ' + lower).includes(' ' + q)) score = 4;
    else score = 2;
    out.push({ it: WIKI_ITEMS[i], score, len: lower.length, pos: lower.indexOf(tokens[0]) });
  }
  out.sort((a, b)=> (b.score - a.score) || (a.pos - b.pos) || (a.len - b.len) || a.it.name.localeCompare(b.it.name));
  return out.slice(0, 60).map(o => ({ name: o.it.name, url: o.it.url, thumb: proxied(o.it.url, 240) }));
}

/* ============================================================
   图片缓存（blob → objectURL，保证画布不被污染）
   ============================================================ */
const imgCache = new Map();
function ensureImage(url, onReady){
  const src = proxied(url, 900);
  if(!src) return null;
  let entry = imgCache.get(src);
  if(entry){ if(entry.loaded && onReady) onReady(entry.img); return entry; }
  entry = { img: null, loaded: false, failed: false };
  imgCache.set(src, entry);
  (async ()=>{
    try{
      await sleep(40 + Math.random() * 60);
      const res = await fetch(src);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      const img = new Image();
      img.decoding = 'async';
      await new Promise((resolve, reject)=>{
        img.onload = resolve;
        img.onerror = reject;
        img.src = objUrl;
      });
      entry.img = img;
      entry.loaded = true;
      if(onReady) onReady(img);
      draw();
    }catch(err){
      entry.failed = true;
      console.warn('图片加载失败', url, err);
    }
  })();
  return entry;
}

/* ============================================================
   画布
   ============================================================ */
const canvas = $('grid');
const ctx = canvas.getContext('2d');

function geom(){
  const contentW = state.cols * COL_W;
  const contentH = state.rows * ROW_H;
  const footerH = state.showFooter && state.footer ? FOOTER_H : 0;
  const W = contentW + MARGIN * 2;
  const H = TITLE_H + contentH + MARGIN * 2 + footerH;
  return { contentW, contentH, footerH, W, H };
}

function applyCanvasWidth(){
  const g = geom();
  const zoom = document.body.classList.contains('canvas-zoom');
  canvas.style.width = g.W + 'px';
  canvas.style.maxWidth = zoom ? 'none' : '100%';
}

function resizeCanvas(){
  const g = geom();
  const scale = 2;
  canvas.width = Math.round(g.W * scale);
  canvas.height = Math.round(g.H * scale);
  applyCanvasWidth();
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}

function font(size, weight){
  return (weight ? weight + ' ' : '') + size + 'px system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif';
}

function fitText(text, maxWidth){
  const t = String(text || '');
  if(ctx.measureText(t).width <= maxWidth) return t;
  let s = t;
  while(s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
  return s + '…';
}

function drawCellImage(cell, x, y, w, h){
  const entry = imgCache.get(proxied(cell.image, 900));
  if(!entry || !entry.loaded){
    ctx.fillStyle = '#f7f4ee';
    ctx.fillRect(x, y, w, h);
    if(entry && entry.failed){
      ctx.fillStyle = '#b8442f';
      ctx.font = font(12);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('图片加载失败', x + w / 2, y + h / 2);
    }
    return;
  }
  const img = entry.img;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  if(state.fit === 'cover'){
    const ir = iw / ih, cr = w / h;
    let sx, sy, sw, sh;
    if(ir > cr){ sh = ih; sw = ih * cr; sx = (iw - sw) / 2; sy = 0; }
    else { sw = iw; sh = iw / cr; sx = 0; sy = (ih - sh) / 2; }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }else{
    const s = Math.min(w / iw, h / ih);
    const dw = iw * s, dh = ih * s;
    ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
  }
}

function labelOf(i){
  const cell = state.cells[i];
  if(cell && cell.label) return cell.label;
  return state.labels[i] || '';
}

function draw(){
  const g = geom();
  const scale = 2;

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.clearRect(0, 0, g.W, g.H);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, g.W, g.H);

  const originX = MARGIN;
  const originY = TITLE_H + MARGIN;
  const contentW = g.contentW;

  ctx.font = font(30, 'bold');
  ctx.fillStyle = '#15110c';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(fitText(state.title || '', contentW), originX + contentW / 2, MARGIN + TITLE_H / 2 - 2);

  ctx.save();
  ctx.translate(originX, originY);

  for(let i = 0; i < state.cols * state.rows; i++){
    const cx = (i % state.cols) * COL_W;
    const cy = Math.floor(i / state.cols) * ROW_H;
    const cell = state.cells[i];

    if(cell && cell.image){
      ctx.save();
      ctx.beginPath();
      ctx.rect(cx + 1, cy + 1, IMG_W, IMG_H);
      ctx.clip();
      drawCellImage(cell, cx + 1, cy + 1, IMG_W, IMG_H);
      ctx.restore();
    }else{
      ctx.fillStyle = '#fff';
      ctx.fillRect(cx + 1, cy + 1, IMG_W, IMG_H);
    }

    ctx.fillStyle = '#ece7de';
    ctx.fillRect(cx + 1, cy + SEP_Y, IMG_W, 1);

    const label = labelOf(i);
    if(label){
      ctx.font = font(14);
      ctx.fillStyle = '#22201b';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(fitText(label, COL_W - 12), cx + COL_W / 2, cy + SEP_Y + CAP_H / 2 + 1);
    }
  }

  ctx.strokeStyle = '#15110c';
  ctx.lineWidth = 2;
  for(let y = 0; y <= state.rows; y++){
    ctx.beginPath();
    ctx.moveTo(0, y * ROW_H);
    ctx.lineTo(contentW, y * ROW_H);
    ctx.stroke();
  }
  for(let x = 0; x <= state.cols; x++){
    ctx.beginPath();
    ctx.moveTo(x * COL_W, 0);
    ctx.lineTo(x * COL_W, state.rows * ROW_H);
    ctx.stroke();
  }

  if(hoverIndex >= 0 && hoverIndex < state.cols * state.rows){
    const cx = (hoverIndex % state.cols) * COL_W;
    const cy = Math.floor(hoverIndex / state.cols) * ROW_H;
    ctx.fillStyle = 'rgba(0,0,0,.52)';
    ctx.fillRect(cx + 2, cy + 2, COL_W - 4, IMG_H - 1);
    ctx.fillStyle = '#fff';
    ctx.font = font(14, 'bold');
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(state.cells[hoverIndex] ? '点击更换' : '点击选择图片', cx + COL_W / 2, cy + IMG_H / 2);
  }

  ctx.restore();

  if(g.footerH && state.footer){
    ctx.font = font(10);
    ctx.fillStyle = '#a9a094';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(fitText(state.footer, contentW), MARGIN, g.H - MARGIN + 2);
  }
}

/* ============================================================
   画布交互
   ============================================================ */
function hitTest(ev){
  const g = geom();
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) / rect.width * g.W - MARGIN;
  const y = (ev.clientY - rect.top) / rect.height * g.H - (TITLE_H + MARGIN);
  if(x < 0 || y < 0) return -1;
  const c = Math.floor(x / COL_W);
  const r = Math.floor(y / ROW_H);
  if(c < 0 || c >= state.cols || r < 0 || r >= state.rows) return -1;
  return r * state.cols + c;
}

canvas.addEventListener('mousemove', ev=>{
  const i = hitTest(ev);
  if(i !== hoverIndex){ hoverIndex = i; draw(); }
});
canvas.addEventListener('mouseleave', ()=>{ if(hoverIndex !== -1){ hoverIndex = -1; draw(); } });
canvas.addEventListener('click', ev=>{
  const i = hitTest(ev);
  if(i < 0) return;
  openPicker(i);
});

const pickerEl = $('picker');
const qInput = $('q');

const searchNoteEl = $('searchNote');

function setNote(text, isErr){
  searchNoteEl.className = 'note' + (isErr ? ' err' : '');
  searchNoteEl.textContent = text || '';
}
function setBusy(busy){
  const btn = $('searchBtn');
  btn.disabled = busy;
  btn.textContent = busy ? '搜索中…' : '搜索';
  resultsEl.classList.toggle('loading', busy);
}

function openPicker(index){
  currentIndex = index;
  const cell = state.cells[index];
  const label = state.labels[index] || '';
  $('cellTag').textContent = '第 ' + (index + 1) + ' 格' + (label ? ' · ' + label : '');
  $('urlInput').value = '';
  resultsEl.innerHTML = '';
  resultsEl._items = [];
  setBusy(false);
  setNote(cell && cell.image
    ? '已选图片，可重新搜索替换，或直接上传本地图片。'
    : '');
  pickerEl.hidden = false;
  document.body.classList.add('locked');
  setTimeout(()=> qInput.focus(), 40);
  doSearch(qInput.value);
}

function closeModal(el){
  el.hidden = true;
  document.body.classList.remove('locked');
}
pickerEl.addEventListener('click', ev=>{ if(ev.target === pickerEl) closeModal(pickerEl); });
document.querySelectorAll('[data-close]').forEach(b=>{
  b.addEventListener('click', ()=> closeModal(b.closest('.modal')));
});
document.addEventListener('keydown', ev=>{
  if(ev.key === 'Escape') document.querySelectorAll('.modal:not([hidden])').forEach(m=> closeModal(m));
});

function doSearch(kw){
  const q = String(kw || '').trim();
  setBusy(false);
  const items = searchImages(q);
  if(!q){
    setNote('已收录 ' + WIKI_ITEMS.length + ' 张 The Bazaar Wiki 图片。输入英文关键词（如 sword、potion、Vanessa）检索，或上传本地图片／粘贴图片网址。');
    renderResults(items);
    return;
  }
  if(!items.length){
    resultsEl.innerHTML = '';
    resultsEl._items = [];
    setNote('没找到「' + q + '」。图片名多为英文（如 sword、shield、potion、boots），换个词试试，或直接上传图片。', true);
    return;
  }
  setNote('匹配 ' + items.length + ' 张，点击即可放入格子。');
  renderResults(items);
}

function renderResults(items){
  resultsEl.innerHTML = items.map((it, i)=>
    '<div class="ritem" data-i="' + i + '">' +
      '<div class="box"><img src="' + esc(it.thumb) + '" loading="lazy" alt=""></div>' +
      '<p>' + esc(it.name) + '</p>' +
    '</div>'
  ).join('');
  resultsEl._items = items;
  resultsEl.querySelectorAll('.ritem').forEach(el=>{
    el.addEventListener('click', ()=>{
      resultsEl.querySelectorAll('.ritem.on').forEach(x=> x.classList.remove('on'));
      el.classList.add('on');
      applyImage(resultsEl._items[+el.dataset.i]);
    });
  });
}

/* --- 落图 --- */
function applyImage(img){
  if(currentIndex === null) return;
  if(!img || !img.url){ toast('这张图没有可用地址'); return; }
  const cell = state.cells[currentIndex] || {};
  state.cells[currentIndex] = {
    kind: 'image',
    image: img.url,
    name: img.name || '',
    label: cell.label || '',
    source: img.source || 'wiki'
  };
  ensureImage(img.url);
  persist(); draw(); syncMobile();
  closeModal(pickerEl);
  toast('已放入第 ' + (currentIndex + 1) + ' 格');
}

$('uploadBtn').addEventListener('click', ()=> $('imgFile').click());
$('imgFile').addEventListener('change', async e=>{
  const file = e.target.files && e.target.files[0];
  e.target.value = '';
  if(!file || currentIndex === null) return;
  try{
    const dataUrl = await new Promise((resolve, reject)=>{
      const fr = new FileReader();
      fr.onload = ()=> resolve(fr.result);
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
    const cell = state.cells[currentIndex] || {};
    state.cells[currentIndex] = {
      kind: 'image', image: dataUrl,
      name: file.name.replace(/\.[^.]+$/, ''),
      label: cell.label || '', source: 'local'
    };
    ensureImage(dataUrl);
    persist(); draw(); syncMobile();
    closeModal(pickerEl);
    toast('已放入本地图片');
  }catch(err){
    toast('读取图片失败');
  }
});

$('urlBtn').addEventListener('click', async ()=>{
  const url = $('urlInput').value.trim();
  if(!url) { $('urlInput').focus(); return; }
  if(!/^https?:\/\//i.test(url)){ setNote('请粘贴 http(s) 开头的图片网址。', true); return; }
  if(currentIndex === null) return;
  const cell = state.cells[currentIndex] || {};
  state.cells[currentIndex] = {
    kind: 'image', image: url,
    name: url.split('/').pop().replace(/\.[^.]+$/, ''),
    label: cell.label || '', source: 'url'
  };
  ensureImage(url);
  persist(); draw(); syncMobile();
  closeModal(pickerEl);
  toast('已使用该网址的图片');
});

$('clearBtn').addEventListener('click', ()=>{
  if(currentIndex === null) return;
  state.cells[currentIndex] = null;
  persist(); draw(); syncMobile();
  closeModal(pickerEl);
});

/* ============================================================
   设置面板
   ============================================================ */
function labeledCount(){ return state.cols * state.rows; }

function syncPanel(){
  $('titleInput').value = state.title;
  $('colsInput').value = state.cols;
  $('rowsInput').value = state.rows;
  $('labelsInput').value = state.labels.join('\n');
  $('labelCount').textContent = labeledCount();
  $('footerInput').value = state.footer;
  $('footerShow').checked = state.showFooter;
  $('fitSel').value = state.fit;
  $('fmtSel').value = state.format;
  $('scaleSel').value = String(state.scale);
}

function normalizeLabels(){
  const n = labeledCount();
  const arr = state.labels.slice(0, n);
  while(arr.length < n) arr.push(DEFAULT_LABELS[arr.length] || '');
  state.labels = arr;
  const cells = state.cells.slice(0, n);
  while(cells.length < n) cells.push(null);
  state.cells = cells;
}

$('titleInput').addEventListener('input', e=>{ state.title = e.target.value; persist(); draw(); });
$('footerInput').addEventListener('input', e=>{ state.footer = e.target.value; persist(); resizeCanvas(); draw(); });
$('footerShow').addEventListener('change', e=>{ state.showFooter = e.target.checked; persist(); resizeCanvas(); draw(); });
$('fitSel').addEventListener('change', e=>{ state.fit = e.target.value === 'cover' ? 'cover' : 'contain'; persist(); draw(); });
$('fmtSel').addEventListener('change', e=>{ state.format = e.target.value; persist(); });
$('scaleSel').addEventListener('change', e=>{ state.scale = +e.target.value; persist(); });

$('colsInput').addEventListener('change', e=>{
  const v = Math.max(1, Math.min(8, parseInt(e.target.value, 10) || 5));
  state.cols = v; e.target.value = v;
  normalizeLabels(); persist(); syncPanel(); syncMobile(); resizeCanvas(); draw();
});
$('rowsInput').addEventListener('change', e=>{
  const v = Math.max(1, Math.min(8, parseInt(e.target.value, 10) || 3));
  state.rows = v; e.target.value = v;
  normalizeLabels(); persist(); syncPanel(); syncMobile(); resizeCanvas(); draw();
});
$('labelsInput').addEventListener('input', e=>{
  state.labels = e.target.value.split('\n').map(s=> s.trim());
  normalizeLabels();
  $('labelCount').textContent = labeledCount();
  persist(); draw(); syncMobile();
});

$('defaultLabelsBtn').addEventListener('click', ()=>{
  const n = labeledCount();
  state.labels = DEFAULT_LABELS.slice(0, n);
  while(state.labels.length < n) state.labels.push('');
  persist(); syncPanel(); draw(); syncMobile();
  toast('已套用默认格名');
});
$('clearLabelsBtn').addEventListener('click', ()=>{
  state.labels = new Array(labeledCount()).fill('');
  persist(); syncPanel(); draw(); syncMobile();
});
$('resetBtn').addEventListener('click', ()=>{
  if(!confirm('清空全部格子？格名与标题保留。')) return;
  state.cells = new Array(labeledCount()).fill(null);
  persist(); draw(); syncMobile();
});

$('saveJsonBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (state.title || 'bazaar-grid') + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(a.href), 4000);
});
$('loadJsonBtn').addEventListener('click', ()=> $('fileInput').click());
$('fileInput').addEventListener('change', async e=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!data || typeof data !== 'object') throw new Error('格式不正确');
    state.title = String(data.title || state.title);
    state.cols = Math.max(1, Math.min(8, +data.cols || 5));
    state.rows = Math.max(1, Math.min(8, +data.rows || 3));
    state.labels = Array.isArray(data.labels) ? data.labels.map(String) : DEFAULT_LABELS.slice();
    state.cells = Array.isArray(data.cells) ? data.cells : new Array(state.cols * state.rows).fill(null);
    state.footer = String(data.footer != null ? data.footer : state.footer);
    state.showFooter = data.showFooter !== false;
    state.fit = data.fit === 'cover' ? 'cover' : 'contain';
    normalizeLabels();
    loadAllImages();
    persist(); syncPanel(); syncMobile(); resizeCanvas(); draw();
    toast('配置已导入');
  }catch(err){
    toast('导入失败：' + err.message);
  }finally{
    e.target.value = '';
  }
});

/* ============================================================
   移动端格子列表
   ============================================================ */
const mobileMQ = window.matchMedia('(max-width:760px)');
const isMobile = ()=> mobileMQ.matches;

function setLabel(i, v){
  state.labels[i] = v;
  const cell = state.cells[i];
  if(cell && cell.label) cell.label = '';
  persist(); draw();
}

function syncMobile(){
  const list = $('cellList');
  if(!isMobile()){ list.innerHTML = ''; return; }
  const n = labeledCount();
  let html = '';
  for(let i = 0; i < n; i++){
    const cell = state.cells[i];
    const label = labelOf(i);
    const thumb = cell && cell.image
      ? '<img class="thumb" src="' + esc(proxied(cell.image, 120)) + '" alt="" loading="lazy">'
      : '<div class="thumb">＋</div>';
    html += '<div class="cell-row">' +
      '<span class="idx">' + (i + 1) + '</span>' + thumb +
      '<div class="meta">' +
        '<input class="label-input" data-i="' + i + '" value="' + esc(label) + '" placeholder="格名">' +
        '<div class="sub">' + esc(cell ? (cell.name || '已选图片') : '空') + '</div>' +
      '</div>' +
      '<div class="acts">' +
        '<button class="mini" data-pick="' + i + '">' + (cell ? '更换' : '选择') + '</button>' +
        '<button class="mini danger" data-clear="' + i + '">清空</button>' +
      '</div></div>';
  }
  list.innerHTML = html;
  list.querySelectorAll('.label-input').forEach(inp=>{
    const i = +inp.dataset.i;
    inp.addEventListener('input', ()=> setLabel(i, inp.value));
    inp.addEventListener('change', ()=> syncMobile());
  });
  list.querySelectorAll('[data-pick]').forEach(b=> b.addEventListener('click', ()=> openPicker(+b.dataset.pick)));
  list.querySelectorAll('[data-clear]').forEach(b=> b.addEventListener('click', ()=>{
    const i = +b.dataset.clear;
    if(!state.cells[i]) return;
    state.cells[i] = null;
    persist(); draw(); syncMobile();
  }));
}
mobileMQ.addEventListener('change', ()=>{ applyCanvasWidth(); draw(); syncMobile(); });

/* ============================================================
   导出
   ============================================================ */
function pendingImages(){
  const out = [];
  state.cells.forEach(c=>{
    if(c && c.image){
      const e = imgCache.get(proxied(c.image, 900));
      if(!e || !e.loaded) out.push(c.image);
    }
  });
  return out;
}

$('exportBtn').addEventListener('click', async ()=>{
  const btn = $('exportBtn');
  const ori = btn.textContent;
  btn.disabled = true;

  const missing = pendingImages();
  missing.forEach(u=> ensureImage(u));
  const t0 = Date.now();
  while(pendingImages().length && Date.now() - t0 < 20000){
    btn.textContent = '载入图片 ' + pendingImages().length + '…';
    await sleep(120);
  }
  if(pendingImages().length) toast('部分图片未能载入，已按占位生成');

  btn.textContent = '生成中…';
  await sleep(30);

  const scale = Math.max(1, Math.min(3, state.scale));
  const out = document.createElement('canvas');
  out.width = Math.round(canvas.width / 2 * scale);
  out.height = Math.round(canvas.height / 2 * scale);
  const octx = out.getContext('2d');
  octx.imageSmoothingQuality = 'high';
  octx.drawImage(canvas, 0, 0, out.width, out.height);

  const mime = state.format === 'jpeg' ? 'image/jpeg' : 'image/png';
  const ext = state.format === 'jpeg' ? 'jpg' : 'png';
  let dataUrl;
  try{
    dataUrl = out.toDataURL(mime, 0.92);
  }catch(err){
    toast('导出失败：' + err.message);
    btn.disabled = false; btn.textContent = ori;
    return;
  }

  $('previewImg').src = dataUrl;
  $('previewSize').textContent = out.width + ' × ' + out.height;
  const name = (state.title || '大巴扎生涯个人爱好表').replace(/[\\/:*?"<>|]/g, '_') + '.' + ext;
  const link = $('downloadLink');
  link.href = dataUrl;
  link.download = name;
  $('preview').hidden = false;
  document.body.classList.add('locked');

  btn.disabled = false;
  btn.textContent = ori;
});

/* ============================================================
   持久化
   ============================================================ */
function persist(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(err){}
}
function restore(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    if(!data || typeof data !== 'object') return;
    state.title = String(data.title != null ? data.title : state.title);
    state.cols = Math.max(1, Math.min(8, +data.cols || 5));
    state.rows = Math.max(1, Math.min(8, +data.rows || 3));
    state.labels = Array.isArray(data.labels) ? data.labels.map(String) : DEFAULT_LABELS.slice();
    state.cells = Array.isArray(data.cells) ? data.cells : [];
    state.footer = String(data.footer != null ? data.footer : state.footer);
    state.showFooter = data.showFooter !== false;
    state.fit = data.fit === 'cover' ? 'cover' : 'contain';
    state.format = data.format === 'jpeg' ? 'jpeg' : 'png';
    state.scale = [1,2,3].includes(+data.scale) ? +data.scale : 2;
    normalizeLabels();
  }catch(err){}
}
function loadAllImages(){
  state.cells.forEach(c=>{ if(c && c.image) ensureImage(c.image); });
}

/* ============================================================
   启动
   ============================================================ */
restore();
normalizeLabels();
syncPanel();
resizeCanvas();
loadAllImages();
draw();
syncMobile();

window.addEventListener('resize', ()=>{ applyCanvasWidth(); draw(); });

})();
</script>
</body>
</html>
